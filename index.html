function v7CourtMiniCounts(pool){
  const vals = [1,2,3,4,5,6].map(z=>pool.filter(e=>Number(e.endZone)===z).length);
  const mx = Math.max(1, ...vals);
  return ['4','3','2','5','6','1'].map(z=>{
    const n = pool.filter(e=>String(e.endZone)===z).length;
    const a = n / mx;
    const bg = n===0 ? '#d5e3db' : (a>0.66 ? '#86efac' : (a>0.33 ? '#fef08a' : '#fecaca'));
    return `<div style="background:${bg}"><span style="font-size:24px">${n}</span><small>Zone ${z}</small></div>`;
  }).join('');
}

function courtChart(opts){
  const cfg = opts || {};
  const source = cfg.source || 'team';
  const mode = cfg.mode || 'match';
  const side = cfg.side || 'home';
  const action = cfg.action || 'all';
  const playerId = cfg.playerId || 'all';
  const all = courtEventPool({source,mode,side,action,playerId});
  const selected = String(state.v6.zoneFilter || 'all');
  const counts = {};
  for(let z=1; z<=6; z++) counts[z] = all.filter(e=>Number(e.endZone)===z);
  const max = Math.max(1, ...Object.values(counts).map(x=>x.length));
  function pts(z){
    return counts[z].slice(-18).map((e,i)=>{
      const base = {4:[90,70],3:[268,70],2:[446,70],5:[90,240],6:[268,240],1:[446,240]}[z];
      const x = base[0] + ((i*19 + z*11)%110) - 55;
      const y = base[1] + ((i*23 + z*7)%92) - 46;
      return e.positive ? `<circle cx="${x}" cy="${y}" r="6" fill="#2dd4bf" stroke="#ecfeff" stroke-width="2"></circle>` : `<path d="M${x-6} ${y-6} L${x+6} ${y+6} M${x+6} ${y-6} L${x-6} ${y+6}" stroke="#ef4444" stroke-width="3" stroke-linecap="round"></path>`;
    }).join('');
  }
  function cell(z,cx,cy,w,h){
    const n = counts[z].length;
    const g = counts[z].filter(e=>e.positive).length;
    const b = n - g;
    const alpha = (0.18 + 0.68 * n / max).toFixed(2);
    const fill = n===0 ? 'rgba(226,232,240,.18)' : (g>=b ? `rgba(34,197,94,${alpha})` : (b>g ? `rgba(239,68,68,${alpha})` : `rgba(250,204,21,${alpha})`));
    return `<g data-v6="zone" data-zone="${z}" role="button" tabindex="0"><rect class="zone ${selected===String(z)?'selected':''}" x="${cx}" y="${cy}" width="${w}" height="${h}" rx="12" fill="${fill}" stroke="rgba(255,255,255,.5)"></rect><text x="${cx+w/2}" y="${cy+24}" font-size="16" font-weight="800" text-anchor="middle" fill="#ffffff">Z${z}</text><text x="${cx+w/2}" y="${cy+h-16}" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">${n} · ${g}✓ · ${b}✕</text>${pts(z)}</g>`;
  }
  const svg = `<svg class="v6-svgcourt" viewBox="0 0 540 390" role="img" aria-label="Volleyball court heatmap"><defs><linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#bb8d52"></stop><stop offset="0.5" stop-color="#d7b07c"></stop><stop offset="1" stop-color="#b7844a"></stop></linearGradient><linearGradient id="wood2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#eed3a6"></stop><stop offset="1" stop-color="#c49359"></stop></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".25"></feDropShadow></filter></defs><rect x="16" y="20" width="508" height="350" rx="24" fill="#0b1720"></rect><rect x="30" y="34" width="480" height="322" rx="18" fill="url(#wood)" filter="url(#shadow)"></rect><rect x="30" y="34" width="480" height="322" rx="18" fill="url(#wood2)" opacity=".22"></rect><line x1="30" y1="196" x2="510" y2="196" stroke="#ffffff" stroke-width="5"></line><line x1="190" y1="34" x2="190" y2="356" stroke="#ffffff" stroke-width="4"></line><line x1="350" y1="34" x2="350" y2="356" stroke="#ffffff" stroke-width="4"></line><line x1="30" y1="116" x2="510" y2="116" stroke="#ffffff" stroke-width="2" opacity=".45"></line><line x1="30" y1="276" x2="510" y2="276" stroke="#ffffff" stroke-width="2" opacity=".45"></line>${cell(4,38,42,148,145)}${cell(3,196,42,148,145)}${cell(2,354,42,148,145)}${cell(5,38,203,148,145)}${cell(6,196,203,148,145)}${cell(1,354,203,148,145)}</svg>`;
  const selEvents = selected==='all' ? all.slice(-10).reverse() : all.filter(e=>String(e.endZone)===selected).slice(-10).reverse();
  const detail = selEvents.length ? selEvents.map(e=>`<div class="v6-zonecard"><strong>${esc(e.playerName)}</strong> · ${esc(e.action||'event')} <span class="${e.positive?'v6-positive':'v6-error'}">${esc(e.effect||'+')}</span><div class="v6-local-only">Zone ${esc(e.endZone)} · ${esc(e.time||'Time not recorded')} · ${esc(e.source||'demo')}</div></div>`).join('') : emptyMsg('No location-tagged actions for this selection.');
  return `<div class="v7-report-grid"><div class="v7-report-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><h3 style="margin:0">3D-style court heatmap</h3><div class="v7-mini-note">Green = positive outcomes; red = errors. Synthetic starter-game zones are illustrative, not measured.</div></div><button class="v6-pick" data-v6="zone" data-zone="all">Show all zones</button></div>${svg}</div><div class="v7-report-card"><div class="row wrap"><span class="chip blue">${all.length} mapped actions</span><span class="chip dim">${esc(TEAM(side))}</span></div><h3 style="margin:10px 0 8px">Zone summary</h3><div class="v7-print-heat">${v7CourtMiniCounts(all)}</div><h3 style="margin:16px 0 8px">${selected==='all'?'Recent mapped actions':'Zone '+selected+' detail'}</h3>${detail}</div></div>`;
}


const v7OriginalCourtPool=courtEventPool;
courtEventPool=function(opts){
 const options=opts||{}, rows=v7OriginalCourtPool(options);
 if(options.source!=='official')return rows;
 const sample=liveGame().events.filter(e=>e.side===(options.side||'home')&&e.origin==='synthetic'&&e.kind==='rally'&&!e.endZone&&['Attack kill','Ace'].includes(e.skill));
 const pattern=['1','6','5','1','5','6','2','4','1','6','5','3'];
 const inferred=sample.map((e,i)=>({id:e.id,playerName:e.playerName||'Team action',playerId:e.playerId||'',side:e.side,action:e.skill==='Ace'?'serve':'attack',effect:'#',endZone:pattern[(i+(e.side==='away'?3:0))%pattern.length],startZone:'',time:e.time||'',source:'illustrative seeded zone (not measured)',outcome:e.skill,positive:true,syntheticZone:true})).filter(e=>(options.action==='all'||!options.action||e.action===options.action)&&(options.playerId==='all'||!options.playerId||e.playerId===options.playerId));
 return rows.concat(inferred);
};

ayer and skill detail. Match scouting and training scouting remain separated in the source database but can later roll up into the club-wide performance intelligence model.</p></div></div>`;

function v9MapRecords(options={}){
 const {source='official',mode='match',side='home',action='all',playerId='all',outcome='all'}=options;
 let items=[];

   for(const e of liveGame().events){
     if(e.side!==side||!['rally','skill'].includes(e.kind))continue;
     let a='',z='',effect=e.effect||'#',positive=true;
     if(e.kind==='rally'){
       if(e.skill==='Ace')a='serve';
       if(e.skill==='Attack kill')a='attack';
       if(e.skill==='Block point')a='block';
       z=String(e.endZone||''); if(!a||!z)continue;
     }else{
       const code={S:'serve',R:'reception',E:'set',A:'attack',B:'block',D:'dig'};
       a=code[e.skill]||'';if(!a)continue;
       // Contact actions should use the observation's start zone, not the pass-to-setter target.
       const contact=['reception','dig','defense','block'].includes(a);
       z=String((contact?e.startZone:e.endZone)||'');
       if(!z)continue;
       if(e.linkedRallyId&&effect==='#'&&['serve','attack','block'].includes(a)){
         const linked=liveGame().events.find(x=>x.id===e.linkedRallyId);
         if(linked&&((a==='serve'&&linked.skill==='Ace')||(a==='attack'&&linked.skill==='Attack kill')||(a==='block'&&linked.skill==='Block point')))continue;
       }
       positive=['#','+','!'].includes(effect);
     }
     items.push({id:e.id,side,playerName:e.playerName||'Team action',playerId:e.playerId||'',action:a,
       effect,positive,endZone:z,startZone:String(e.startZone||''),time:e.time||'',source:e.origin||'official',
       outcome:e.skill||'',syntheticZone:!!e.syntheticZone || String(e.origin||'').includes('synthetic'),
       coordinateType:['reception','dig','block'].includes(a)?'contact zone':'target / landing zone'});
   }
 }else{
   items=scoutingEvents(mode,side).filter(e=>e.action&&e.action!=='rally').map(e=>{
     const contact=['reception','dig','defense','block'].includes(e.action);
     return {...e,positive:['#','+','!'].includes(e.effect),endZone:String((contact?e.startZone:e.endZone)||''),
       syntheticZone:e.source==='synthetic-demo'||e.syntheticZone,
       coordinateType:contact?'contact zone':'target / landing zone'};
   });
 }
 return items.filter(e=>/^[1-6]$/.test(String(e.endZone))&&
   (action==='all'||e.action===action)&&(playerId==='all'||e.playerId===playerId)&&
   (outcome==='all'||(outcome==='positive'?e.positive:!e.positive)));
}

  const reverse = side => side==='home'?'away':'home';
  const nameSide = side => side==='home'?liveGame().home:liveGame().away;
  const players = side => side==='home'?liveGame().homeRoster:liveGame().awayRoster;
  const code = action => (actionNames.find(row=>row[0]===action)||[])[2]||'D';
  const isContact = action => ['reception','dig','block'].includes(action);
  const timeNow = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const allowed = (player,action) => !!player && !(player.position==='Libero'&&['serve','attack','block'].includes(action));

  function v12State(){
    const v = state.v12 ||= {side:'home',playerId:'',action:'serve',grade:'#',officialMode:'new',status:'',lastGroup:''};
    if(!['home','away'].includes(v.side))v.side='home';
    if(!actionNames.some(a=>a[0]===v.action))v.action='serve';
    if(!grades.some(g=>g[0]===v.grade))v.grade='#';
    if(!['new','attach'].includes(v.officialMode))v.officialMode='new';
    if(!players(v.side).some(p=>p.id===v.playerId))v.playerId='';
    state.v6 ||= {};
    state.v6.stage ||= 'match';
    state.v6.reportMode ||= 'match';
    state.v6.sessionId ||= 'training-2026-10-22';
    state.teamScoutEvents ||= [];
    return v;
  }
  function selected(){const v=v12State();return players(v.side).find(p=>p.id===v.playerId)||null;}
  function locationFields(zone,action){
    const z=String(zone);
    return {startZone:isContact(action)?z:'',endZone:action==='block'?z:(isContact(action)?'':z),locationType:action==='block'?'block-contact-zone':(isContact(action)?'contact-zone':'target-zone'),courtZone:z};
  }
  function persist(type,description,message){
    if(typeof v3Audit==='function')v3Audit(type,description);
    state.v12.status=message;
    save();present();toast(message);
  }
  function statusMessageForAction(p,action,grade,zone,scoreText='Score unchanged'){
    return `${p.name}: ${action} (${grades.find(x=>x[0]===grade)?.[1]||grade}) in Z${zone}. ${scoreText}.`;
  }
  function matchDone(){const m=liveGame();return matchDerived(m).final||m.status==='final';}

  function recordOfficial(zone,player,v){
    const m=liveGame(),loc=locationFields(zone,v.action),v6=state.v6||{},now=timeNow();
    const match=matchDerived(m);const ps=pointSkill[v.action];
    if(v.officialMode==='attach'){
      const wantScorer= v.grade==='#' && !!ps;
      const entry=[...m.events].reverse().find(e=>{
        if(e.side!==v.side||e.playerId!==player.id)return false;
        if(wantScorer)return e.kind==='rally'&&e.skill===ps;
        return e.kind==='skill'&&e.skill===code(v.action)&&e.effect===v.grade;
      });
      if(!entry){toast('No matching official event for this player, action and outcome. Choose Record new action.',true);return false;}
      if(entry.v12Capture){toast('This action already has a court zone. Record another action or edit it from the audit history.',true);return false;}
      Object.assign(entry,loc,{v12Capture:true,locationSource:'v12-recorder'});
      persist('Official location attribution',`${player.name} · ${v.action} · Z${zone}`,`Location tagged for ${player.name}. Score unchanged.`);
      return true;
    }
    if(matchDone()){toast('This match is finished. No additional official events can be recorded.',true);return false;}
    const group=uid();
    const base={set:match.current,side:v.side,playerId:player.id,playerName:player.name,time:now,origin:'v12-recorder',v12Capture:true,groupId:group,...loc};
    if(v.grade==='='){
      // Own-side error is logged first, then exactly one opponent rally point.
      m.events.push({id:uid(),kind:'skill',skill:code(v.action),action:v.action,effect:'=',note:'Own-team error',...base});
      m.events.push({id:uid(),kind:'rally',set:match.current,side:reverse(v.side),playerId:'',playerName:'',skill:'Opponent error',faultSide:v.side,faultType:code(v.action),time:now,note:`${nameSide(v.side)} error - point to ${nameSide(reverse(v.side))}`,origin:'v12-recorder',groupId:group});
      v.lastGroup=group;
      persist('Official error',`${player.name} ${v.action} error; opponent awarded point`,`Own error by ${player.name}: +1 point for ${nameSide(reverse(v.side))}.`);
      return true;
    }
    if(v.grade==='#' && ps){
      m.events.push({id:uid(),kind:'rally',skill:ps,note:'One-click scored and located rally',...base});
      v.lastGroup=group;
      persist('Official point',`${player.name} ${ps} in zone ${zone}`,`${nameSide(v.side)} +1: ${ps} by ${player.name}, Z${zone}.`);
      return true;
    }
    m.events.push({id:uid(),kind:'skill',skill:code(v.action),action:v.action,effect:v.grade,note:'Technical observation (no rally score)',...base});
    v.lastGroup=group;
    persist('Official skill observation',`${player.name} ${v.action} ${v.grade} Z${zone}`,statusMessageForAction(player,v.action,v.grade,zone));
    return true;
  }

  function recordStatistician(zone,player,v){
    const m=liveGame(),v6=state.v6,session=v6.stage==='training'?'training':'match',loc=locationFields(zone,v.action),group=uid();
    const row={id:uid(),groupId:group,mode:session,sport:'volleyball',side:v.side,
      matchId:session==='match'?m.id:null,sessionId:session==='training'?v6.sessionId:null,
      playerId:player.id,playerName:player.name,playerPosition:player.position,
      action:v.action,effect:v.grade,rotation:Number(v6.rotation||1),phase:v6.phase||'Receive',
      targetPlayerId:v.action==='set'?(v6.setterTarget||''):'',
      rallyIndex:session==='match'?Math.max(1,matchDerived(m).history.length):null,
      drill:session==='training'?(v6.drill||'Position-specific skill observation'):'',
      source:'v12-recorder',date:new Date().toISOString().slice(0,10),time:timeNow(),...loc};
    state.teamScoutEvents.push(row);
    v6.side=v.side;v6.reportSide=v.side;v6.reportMode=session;
    v.lastGroup=group;
    persist('Team court scouting',`${session}: ${player.name} ${v.action} ${v.grade} Z${zone}`,statusMessageForAction(player,v.action,v.grade,zone,`${session==='match'?'Match scouting':'Training'} saved; official score unchanged`));
    return true;
  }
  function record(zone){
    const v=v12State(),p=selected();
    if(!['1','2','3','4','5','6'].includes(String(zone)))return;
    if(state.sport!=='volleyball'||!['official','statistician'].includes(state.role))return;
    if(!p){toast('Choose a player from one of the first two columns.',true);return;}
    if(!allowed(p,v.action)){toast(`The ${v.action} action is not permitted for a libero in this demo. Choose reception, setting or dig.`,true);return;}
    if(state.role==='official')recordOfficial(String(zone),p,v);
    else recordStatistician(String(zone),p,v);
  }
  function undoLast(){
    const v=v12State(),g=v.lastGroup;if(!g){toast('No newly recorded action to undo.',true);return;}
    if(state.role==='official'){
      const m=liveGame(),items=m.events.filter(e=>e.groupId===g);
      if(!items.length){toast('No new official event to undo.',true);return;}
      const last=m.events.at(-1);
      if(last.groupId!==g){toast('Other events were entered afterward. Review the official audit before correcting.',true);return;}
      m.events=m.events.filter(e=>e.groupId!==g);
    }else{
      const n=state.teamScoutEvents.length-1;
      if(n<0||state.teamScoutEvents[n].groupId!==g){toast('Only the latest scouting observation can be undone.',true);return;}
      state.teamScoutEvents.pop();
    }
    v.lastGroup='';
    persist('Court recorder undo','Removed latest entered action','Last recorded action removed.');
  }
  function counter(side,mode){
    if(mode==='official')return liveGame().events.filter(e=>e.origin==='v12-recorder'&&e.side===side).length;
    const m=liveGame();return state.teamScoutEvents.filter(e=>e.source==='v12-recorder'&&e.side===side&&(state.v6.stage==='match'?e.matchId===m.id:e.sessionId===state.v6.sessionId)).length;
  }
  function v12Recent(){
    const m=liveGame(),rows=state.role==='official'?m.events.filter(e=>e.origin==='v12-recorder' && e.kind!=='team-error').slice(-9).reverse():state.teamScoutEvents.filter(e=>e.source==='v12-recorder'&&e.mode===state.v6.stage).slice(-9).reverse();
    return rows.length?rows.map(e=>`<div class="v12-history-line"><span>${esc(e.playerName||nameSide(e.side))} · ${esc(e.action||e.skill)} · ${esc(e.effect||'Point')}</span><b>${esc(e.courtZone||e.startZone||e.endZone||'—')}</b></div>`).join(''):'<p class="v12-note">No manually recorded court events yet.</p>';
  }
  function teamList(side,v){
    return `<div class="v12-list">${players(side).map(p=>{
      const active=v.side===side&&v.playerId===p.id;
      return `<button type="button" class="v12-btn ${active?'active':''}" data-v12="player" data-side="${side}" data-player="${esc(p.id)}" aria-pressed="${active}" aria-label="Select #${esc(p.number)} ${esc(p.name)} ${esc(p.position)}">#${esc(p.number)} ${esc(p.name)}<small>${esc(p.position)}</small></button>`;
    }).join('')}</div>`;
  }
  function v12Recorder(){
    const v=v12State(),m=liveGame(),p=selected(),d=matchDerived(m),isOfficial=state.role==='official';
    const modes=isOfficial?[['new','Record new action'],['attach','Tag existing event (no score)']]:[['match','Match scouting'],['training','Training scouting']];
    const activeMode=isOfficial?v.officialMode:state.v6.stage;
    const scoreNote=isOfficial?`Set ${d.current} · Current score ${d.score[0]}–${d.score[1]} · Sets ${d.wins[0]}–${d.wins[1]}`:`${state.v6.stage==='match'?'Match scouting':'Training scouting'} · Official scoreboard stays unchanged`;
    const locationLabel=isContact(v.action)?'Contact zone':'Landing / target zone';
    const scoreExplanation=isOfficial?`A <b>Winner / Perfect</b> serve, attack or block gives your selected player's team +1. An <b>Own Error</b> gives the opponent +1. Other skill ratings do not score.`:`Technical data go into the ${state.v6.stage==='training'?'training':'match'} scouting dataset, without awarding public points.`;
    return `${v3PageTitle()}${v3Hero('Court Recorder · Five-column quick capture','Select one player, choose the skill and outcome, then click the court zone to save immediately. Each column remains visible together.')}
    <div class="v12-bar"><div><b>${esc(m.home)} vs ${esc(m.away)}</b><div class="v12-note">${esc(scoreNote)}</div></div><div class="v12-mode">${modes.map(([key,label])=>`<button type="button" class="${activeMode===key?'active':''}" data-v12="mode" data-value="${key}" aria-pressed="${activeMode===key}">${esc(label)}</button>`).join('')}</div></div>
    <div class="v12-state">Selected athlete: <strong>${p?esc(p.name):'Choose a player'}</strong> &nbsp; | &nbsp; Action: <strong>${esc(actionNames.find(a=>a[0]===v.action)?.[1])}</strong> &nbsp; | &nbsp; Outcome: <strong>${esc(grades.find(g=>g[0]===v.grade)?.[1])}</strong> &nbsp; | &nbsp; Zone meaning: <strong>${locationLabel}</strong>. ${scoreExplanation}</div>
    <div class="v12-frame"><div class="v12-main-scroll"><table class="v12-table"><thead><tr><th>1 · ${esc(m.home)} players</th><th>2 · ${esc(m.away)} players</th><th>3 · Action</th><th>4 · Outcome</th><th>5 · Court Zone — Save</th></tr></thead><tbody><tr><td>${teamList('home',v)}</td><td>${teamList('away',v)}</td><td><div class="v12-optionlist">${actionNames.map(([key,label])=>`<button type="button" class="v12-btn ${v.action===key?'active':''}" data-v12="action" data-value="${key}" aria-pressed="${v.action===key}" ${p&&!allowed(p,key)?'disabled':''}>${esc(label)}</button>`).join('')}</div></td><td><div class="v12-optionlist">${grades.map(([key,label])=>`<button type="button" class="v12-btn ${v.grade===key?'active':''}" data-v12="grade" data-value="${esc(key)}" aria-pressed="${v.grade===key}">${esc(label)}</button>`).join('')}</div></td><td><div class="v12-zone">${[4,3,2,5,6,1].map(n=>`<button type="button" data-v12="zone" data-zone="${n}" aria-label="Save the selected action at Zone ${n}">Z${n}<small>Click to save</small></button>`).join('')}</div><div class="v12-note">Front row: 4–3–2. Back row: 5–6–1. One zone click records one action.</div></td></tr></tbody></table></div><div class="v12-legend"><span>● Green selection = active player/action/outcome</span><span>● ${locationLabel} recorded for chosen action</span><span>● All events marked with original data source</span></div></div>
    ${v.status?`<div class="v12-recorded" role="status">✓ ${esc(v.status)}</div>`:''}
    <div class="v12-toolrow"><button type="button" data-v12="undo">Undo last new recording</button><button type="button" data-page="court">Review court heatmap</button><button type="button" data-page="${isOfficial?'overview':'reports'}">${isOfficial?'Scoring desk':'Scouting report'}</button></div>
    <div class="v12-history"><h3>Recorded locations</h3><div class="v12-legend"><span>${esc(m.home)}: ${counter('home',isOfficial?'official':'private')} actions</span><span>${esc(m.away)}: ${counter('away',isOfficial?'official':'private')} actions</span></div>${v12Recent()}</div>`;
  }
  // Replace only the Court Location Recorder route; other 13 role modules are preserved.
  const before=v3NewPages;
  v3NewPages=function(){
    if(state.sport==='volleyball' && state.page==='locationCapture' && ['official','statistician'].includes(state.role))return v12Recorder;
    return before();
  };
  document.addEventListener('click',function(e){
    const b=e.target.closest('[data-v12]');
    if(!b||state.page!=='locationCapture'||!['official','statistician'].includes(state.role))return;
    e.preventDefault();e.stopImmediatePropagation();
    const v=v12State(),act=b.dataset.v12;
    if(act==='player'){
      const side=b.dataset.side,p=players(side).find(x=>x.id===b.dataset.player);if(!p)return;
      v.side=side;v.playerId=p.id;
      if(!allowed(p,v.action))v.action='reception';
      v.status='';save();present();return;
    }
    if(act==='action'){
      const p=selected(),key=b.dataset.value;
      if(!actionNames.some(x=>x[0]===key)||(p&&!allowed(p,key)))return;
      v.action=key;v.status='';save();present();return;
    }
    if(act==='grade'){v.grade=b.dataset.value;v.status='';save();present();return;}
    if(act==='mode'){
      if(state.role==='official')v.officialMode=b.dataset.value;
      else {state.v6.stage=b.dataset.value;state.v6.reportMode=b.dataset.value;}
      v.status='';save();present();return;
    }
    if(act==='zone'){record(b.dataset.zone);return;}
    if(act==='undo'){undoLast();return;}
  },true);
  const previousPresent = present;
  present = function(){
    previousPresent();
    if(state.sport==='volleyball' && state.page==='locationCapture' && ['official','statistician'].includes(state.role)){
      for(const item of document.querySelectorAll('.body-main .chip.blue')){
        if(/Audited prototype|Integrated prototype/.test(item.textContent||''))item.textContent='V12 · Recorder Fixed';
      }
    }
  };
  document.title='AthletePath 360 | Version 12 Court Recorder';
  present();
})();

</script>
</body>
